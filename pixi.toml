[workspace]
authors = ["Dan Kuester <daniel.kuester@nist.gov>"]
channels = ["conda-forge"]
name = "striqt"
platforms = ["osx-arm64","linux-aarch64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
warmup = "_warmup_striqt"

[dependencies]

# general development
python = ">=3.9.0"
pip = "*"

# I/O and validation
msgspec = "~=0.19"

# numerical
array-api-compat = "*"
dask = "*"
numcodecs = "*"
numexpr = ">=2.8"
numpy = ">=1.23.5"
netcdf4 = "*"
pandas = ">=1.5"
scipy = ">=1.9"
xarray = ">=2024.3"
zarr = ">=2.18.2"

# plotting
mscorefonts = "*"
matplotlib-base = ">=3.7"

# hardware 
soapysdr = ">=0.8.1"
tokei = "*"

[pypi-dependencies]
striqt = {path = ".", editable = true, extras = ["dev"]}

[feature.py39.dependencies]
python = "~=3.9.0"

[feature.py315.dependencies]
python = "~=3.15.0"

[feature.test.dependencies]
nptdms = "*"

[feature.test.pypi-dependencies]
striqt = {path = ".", editable = true, extras = ["dev", "test"]}

[feature.doc.pypi-dependencies]
striqt = {path = ".", editable = true, extras = ["dev", "doc"]}

[feature.cupy]
platforms = ["linux-aarch64", "linux-64", "win-64"]

[feature.cupy.dependencies]
cupy = ">=12.2"

# zensical requires python >= 3.11, and the test feature is shared with test39
[feature.zensical.dependencies]
zensical = "*"
mkdocstrings-python = "*"
mkdocs-click = "*"

[feature.zensical.tasks]
docs = { cmd = "zensical build --clean --strict", env = { MPLCONFIGDIR = ".cache/matplotlib", MPLBACKEND = "agg", STRIQT_CACHE_DIR = ".cache/striqt" } }
docs-serve = { cmd = "zensical serve", env = { MPLCONFIGDIR = ".cache/matplotlib", MPLBACKEND = "agg", STRIQT_CACHE_DIR = ".cache/striqt" } }

[environments]
default = ["py39"]
cupy = ["cupy"]
test = ["test"]
py39 = ["py39"]
py315 = ["py315"]
test39 = ["test","py39"]
test315 = ["test","py315","zensical"]
doc = ["doc", "py315"]
