<!DOCTYPE html>
<html>
<head>
    <title>Striqt WebView - Real-time Radio Diagnostics</title>
    <!-- NOTE: Plotly.py (>=6.0) serializes numpy arrays as base64 typed-array
         specs {dtype, bdata, shape}. That format is only decoded by
         plotly.js >= 2.28.0. Do NOT pin this below 2.28.0 or plots will
         render axes/background but NO data. -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }
        .header {
            background: #16213e;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #0f3460;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 500;
        }
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .control-group label {
            font-size: 0.9rem;
            color: #aaa;
        }
        select {
            background: #0f3460;
            color: #eee;
            border: 1px solid #1a1a2e;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select:hover {
            border-color: #e94560;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e94560;
        }
        .status-dot.connected {
            background: #4ade80;
        }
        .main {
            padding: 1rem;
            height: calc(100vh - 70px);
            display: flex;
            gap: 1rem;
        }
        .plot-area {
            flex: 1;
            min-width: 0;
            height: 100%;
        }
        #plot-container {
            width: 100%;
            height: 100%;
            background: #16213e;
            border-radius: 8px;
        }
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
        }
        .sidebar {
            width: 380px;
            height: 100%;
            background: #16213e;
            border-radius: 8px;
            padding: 1rem;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .coords-section {
            margin-bottom: 1.5rem;
        }
        .coords-section:last-child {
            margin-bottom: 0;
        }
        .coords-section h2 {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #4ade80;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 0.4rem;
        }
        .coords-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        .coords-table th {
            text-align: left;
            padding: 0.4rem 0.5rem;
            color: #888;
            font-weight: 500;
            border-bottom: 1px solid #0f3460;
        }
        .coords-table td {
            padding: 0.3rem 0.5rem;
            border-bottom: 1px solid #0f3460;
            word-break: break-word;
        }
        .coords-table tr:hover {
            background: #1a1a2e;
        }
        .coords-table .coord-name {
            color: #aaa;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.75rem;
            padding-left: 1rem;
        }
        .coords-table .coord-value {
            color: #eee;
        }
        .coords-table .coord-unit {
            color: #888;
            font-style: italic;
        }
        .coords-table .group-header td {
            background: #0f3460;
            color: #4ade80;
            font-weight: 500;
            padding: 0.5rem;
            font-size: 0.85rem;
        }
        .coords-table .group-header:hover {
            background: #0f3460;
        }
        .coords-table .section-header td {
            background: #1a1a2e;
            color: #4ade80;
            font-weight: 500;
            padding: 0.4rem 0.5rem;
            font-size: 0.8rem;
            border-bottom: 1px solid #0f3460;
        }
        .coords-table .section-header:hover {
            background: #1a1a2e;
        }
        /* Collapsible details styling */
        .coords-details {
            margin-bottom: 0.5rem;
        }
        .coords-details summary {
            cursor: pointer;
            padding: 0.5rem 0.75rem;
            background: #0f3460;
            color: #4ade80;
            font-weight: 500;
            font-size: 0.85rem;
            border-radius: 4px;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .coords-details summary::-webkit-details-marker {
            display: none;
        }
        .coords-details summary::before {
            content: '▶';
            font-size: 0.7rem;
            transition: transform 0.2s;
        }
        .coords-details[open] summary::before {
            transform: rotate(90deg);
        }
        .coords-details summary:hover {
            background: #1a4a7a;
        }
        .coords-details .coords-table {
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="header-title">&#x1F4E1; Striqt WebView</h1>
        <div class="controls">
            <div class="control-group">
                <label for="variable-select">Data Variable:</label>
                <select id="variable-select">
                    <option value="">Loading...</option>
                </select>
            </div>
            <div class="status">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text">Connecting...</span>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="sidebar" id="coords-sidebar">
            <div class="coords-section">
                <p style="color: #666; font-size: 0.8rem;">Waiting for data...</p>
            </div>
        </div>
        <div class="plot-area">
            <div id="plot-container">
                <div class="loading">Waiting for data...</div>
            </div>
        </div>
    </div>

    <script>
        const plotContainer = document.getElementById('plot-container');
        const variableSelect = document.getElementById('variable-select');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const coordsSidebar = document.getElementById('coords-sidebar');

        let ws = null;
        let currentVariable = '';
        let plotInitialized = false;
        let variablesInitialized = false;

        // Plotly layout defaults for dark theme.
        // Axis-specific styling lives in axisDefaults (below) and is fanned out
        // across every axis key (xaxis, yaxis, xaxis2, ...) by buildLayout().
        const darkLayout = {
            paper_bgcolor: '#16213e',
            plot_bgcolor: '#1a1a2e',
            font: { color: '#eee' },
            margin: { t: 50, r: 50, b: 60, l: 70 }
        };

        // Grid styling applied to every axis in the merged layout.
        const axisDefaults = { gridcolor: '#2a2a4e', zerolinecolor: '#3a3a5e' };

        // Detect WebGL support once. Line traces arrive as 'scattergl' (WebGL),
        // which fails on clients without a WebGL context. When unsupported we
        // downgrade them to SVG 'scatter' in updatePlot(). Heatmaps are SVG and
        // unaffected either way.
        const webglSupported = (() => {
            try {
                const canvas = document.createElement('canvas');
                return !!(window.WebGLRenderingContext &&
                    (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
            } catch (e) {
                return false;
            }
        })();

        function isPlainObject(v) {
            return v !== null && typeof v === 'object' && !Array.isArray(v);
        }

        // Recursive merge: recurse into plain objects, let arrays/primitives from
        // the source win. Arrays (annotations, shapes) are replaced wholesale
        // because the backend regenerates them every frame.
        function deepMerge(target, source) {
            const out = { ...target };
            for (const key of Object.keys(source)) {
                const sv = source[key];
                const tv = out[key];
                out[key] = (isPlainObject(sv) && isPlainObject(tv))
                    ? deepMerge(tv, sv)   // both objects -> recurse
                    : sv;                 // arrays & primitives -> source wins
            }
            return out;
        }

        // Merge dark theme with incoming layout, then apply grid styling to every
        // axis key present (xaxis, yaxis, xaxis2, yaxis2, ...). Backend-provided
        // title/domain/range/type win over axisDefaults since they spread last.
        function buildLayout(incoming) {
            const merged = deepMerge(darkLayout, incoming);
            for (const key of Object.keys(merged)) {
                if (/^[xy]axis\d*$/.test(key) && isPlainObject(merged[key])) {
                    merged[key] = { ...axisDefaults, ...merged[key] };
                }
            }
            return merged;
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                // Request initial state
                ws.send(JSON.stringify({ type: 'get_state' }));
            };

            ws.onclose = () => {
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                // Reconnect after delay
                setTimeout(connect, 2000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                handleMessage(msg);
            };
        }

        function handleMessage(msg) {
            // Update header title with spec filename if provided
            if (msg.spec_filename) {
                document.getElementById('header-title').textContent = '\u{1F4E1} ' + msg.spec_filename;
            }

            switch (msg.type) {
                case 'state':
                    // State message always updates variables (initial connection)
                    variablesInitialized = false;
                    updateVariableSelect(msg.available_variables, msg.variable_labels, msg.selected_variable);
                    if (msg.coordinates) {
                        updateCoordsTable(msg.coordinates);
                    }
                    break;
                case 'plot_data':
                    updatePlot(msg.data);
                    // Only update variables if not yet initialized (first data after reconnect)
                    if (msg.available_variables && !variablesInitialized) {
                        updateVariableSelect(msg.available_variables, msg.variable_labels, msg.selected_variable);
                    }
                    if (msg.coordinates) {
                        updateCoordsTable(msg.coordinates);
                    }
                    break;
                case 'error':
                    console.error('Server error:', msg.message);
                    showError(msg.message);
                    break;
            }
        }

        function updateCoordsTable(coordinatesData) {
            // coordinatesData has 'num_ports', 'groups' (capture coords), and 'extra_coords' (AcquisitionInfo)
            if (!coordinatesData || !coordinatesData.groups || Object.keys(coordinatesData.groups).length === 0) {
                coordsSidebar.innerHTML = `
                    <div class="coords-section">
                        <p style="color: #666; font-size: 0.8rem;">No capture data yet</p>
                    </div>
                `;
                return;
            }

            const numPorts = coordinatesData.num_ports || 1;
            const groups = coordinatesData.groups;
            const extraCoords = coordinatesData.extra_coords || {};

            let html = '<div class="coords-section">';

            // Render extra_coords (AcquisitionInfo) in ONE unified table inside a
            // single collapsible, with a section-header row per subclass - mirrors
            // the Capture table below. AcquisitionInfo values are scalar (not
            // per-port), so this table is two columns and colspan is 2.
            if (Object.keys(extraCoords).length > 0) {
                html += `
                    <details class="coords-details" open>
                        <summary>Acquisition Info</summary>
                        <table class="coords-table">
                            <thead>
                                <tr>
                                    <th class="coord-name"></th>
                                    <th class="coord-value">Value</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                for (const [className, coords] of Object.entries(extraCoords)) {
                    html += `<tr class="section-header"><td colspan="2">${className}</td></tr>`;

                    for (const coord of coords) {
                        html += `<tr><td class="coord-name">${coord.name}</td>`;
                        html += `<td class="coord-value">${coord.value || ''}</td></tr>`;
                    }
                }

                html += `</tbody></table></details>`;
            }

            // Render all capture coordinate groups in ONE unified table inside a single collapsible
            // Use class names as section header rows within the table for proper column alignment
            html += `
                <details class="coords-details" open>
                    <summary>Capture</summary>
                    <table class="coords-table">
                        <thead>
                            <tr>
                                <th class="coord-name"></th>
            `;

            // Add column headers for each port
            for (let i = 0; i < numPorts; i++) {
                html += `<th class="coord-value">Port ${i}</th>`;
            }
            html += `<th class="coord-unit"></th></tr></thead><tbody>`;

            for (const [className, coords] of Object.entries(groups)) {
                const numCols = numPorts + 2; // name + ports + unit

                // Add a section header row for this class (display full module path)
                html += `<tr class="section-header"><td colspan="${numCols}">${className}</td></tr>`;

                for (const coord of coords) {
                    html += `<tr><td class="coord-name">${coord.name}</td>`;

                    // Add value cells for each port
                    const values = coord.values || [coord.value];
                    for (let i = 0; i < numPorts; i++) {
                        const val = values[i] !== undefined ? values[i] : values[0];
                        html += `<td class="coord-value">${val}</td>`;
                    }

                    html += `<td class="coord-unit">${coord.unit || ''}</td></tr>`;
                }
            }

            html += `</tbody></table></details>`;

            html += '</div>';

            coordsSidebar.innerHTML = html;
        }

        function updateVariableSelect(variables, labels, selected) {
            variableSelect.innerHTML = '';
            if (!variables || variables.length === 0) {
                // No variables available yet - show waiting state
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'Waiting for data...';
                variableSelect.appendChild(option);
                variablesInitialized = false;
                return;
            }
            variables.forEach(v => {
                const option = document.createElement('option');
                option.value = v;
                // Use standard_name from labels if available, otherwise fall back to variable name
                option.textContent = (labels && labels[v]) ? labels[v] : v.replace(/_/g, ' ');
                if (v === selected) {
                    option.selected = true;
                    currentVariable = v;
                }
                variableSelect.appendChild(option);
            });
            variablesInitialized = true;
        }

        function showError(message) {
            plotContainer.innerHTML = `
                <div class="loading" style="flex-direction: column; gap: 1rem;">
                    <div style="color: #e94560; font-size: 1.2rem;">⚠️ ${message}</div>
                    <div style="color: #666; font-size: 0.9rem;">Try selecting a different data variable</div>
                </div>
            `;
            plotInitialized = false;
        }

        function updatePlot(plotData) {
            if (!plotData || plotData.length === 0) {
                return;
            }

            const data = plotData[0];
            // fig.to_json() nests traces under 'data', not 'traces'.
            const traces = data.data;
            // Downgrade WebGL line traces to SVG when WebGL is unavailable.
            // Also bridge NaN gaps (the backend converts Inf -> NaN, e.g. empty
            // dB bins); without connectgaps the SVG line breaks at every gap and
            // can end up invisible while hover/legend still work.
            if (!webglSupported && Array.isArray(traces)) {
                traces.forEach(t => {
                    if (t.type === 'scattergl') {
                        t.type = 'scatter';
                        t.connectgaps = true;
                    }
                });
            }
            const layout = buildLayout(data.layout);

            if (!plotInitialized) {
                Plotly.newPlot(plotContainer, traces, layout, {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['lasso2d', 'select2d']
                });
                plotInitialized = true;
            } else {
                // Use react for efficient updates
                Plotly.react(plotContainer, traces, layout);
            }
        }

        variableSelect.addEventListener('change', (e) => {
            const newVariable = e.target.value;
            if (newVariable && newVariable !== currentVariable) {
                currentVariable = newVariable;
                plotInitialized = false;  // Reset plot for new variable type
                ws.send(JSON.stringify({
                    type: 'select_variable',
                    variable: newVariable
                }));
            }
        });

        // Start connection
        connect();

        // Handle window resize
        window.addEventListener('resize', () => {
            if (plotInitialized) {
                Plotly.Plots.resize(plotContainer);
            }
        });
    </script>
</body>
</html>
