[project]
site_name = "striqt"
site_description = "batched real-time IQ signal analysis and radio environment sensors"
repo_url = "https://github.com/usnistgov/striqt"
docs_dir = "docs"
site_dir = "site"
strict = true
extra_css = ["stylesheets/nist.css"]
extra_javascript = ["javascripts/nist-header.js"]
# the griffe extension lives beside the pages and is not a page
exclude_docs = """
griffe_striqt.py
__pycache__/
templates/
overrides/
"""

nav = [
  { Home = "index.md" },
  { "Command line" = [
      { Acquisition = "cli/acquisition.md" },
      { Specs = "cli/specs.md" },
      { Datasets = "cli/datasets.md" },
  ] },
  { "striqt.waveform" = [
      "api/waveform/index.md",
      { "striqt.waveform.units" = "api/waveform/units.md" },
  ] },
  { "striqt.analysis" = [
      "api/analysis/index.md",
      { "striqt.analysis.specs" = "api/analysis/specs.md" },
      { "striqt.analysis.testing" = "api/analysis/testing.md" },
  ] },
  { "striqt.sensor" = [
      "api/sensor/index.md",
      { "striqt.sensor.specs" = "api/sensor/specs.md" },
      { "striqt.sensor.bindings" = "api/sensor/bindings.md" },
      { "striqt.sensor.calibration" = "api/sensor/calibration.md" },
      { "striqt.sensor.sinks" = "api/sensor/sinks.md" },
      { "striqt.sensor.peripherals" = "api/sensor/peripherals.md" },
  ] },
  { "striqt.figures" = [
      "api/figures/index.md",
      { "striqt.figures.backend" = "api/figures/backend.md" },
  ] },
]

[project.extra]
# the footer carries the NIST footer, not the zensical attribution
generator = false

[project.theme]
# docs/overrides/main.html adds the pages.nist.gov analytics, header, footer, and exit script
custom_dir = "docs/overrides"
# system fonts: a pages.nist.gov page loads no fonts from Google
font = false
features = ["navigation.tabs", "navigation.sections", "navigation.indexes", "content.code.copy"]

# setting markdown_extensions replaces the defaults, so the ones the pages use are relisted
[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true, toc_depth = 3 }
"pymdownx.details" = {}
"pymdownx.highlight" = { anchor_linenums = true }
"pymdownx.inlinehilite" = {}
"pymdownx.superfences" = {}
"pymdownx.snippets" = { base_path = ["."], check_paths = true }
"pymdownx.tabbed" = { alternate_style = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"mkdocs-click" = {}

[project.plugins.mkdocstrings]
default_handler = "python"
enable_inventory = true
custom_templates = "docs/templates"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
# no `inventories`: the build runs without network access

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
extensions = ["docs/griffe_striqt.py:StriqtRuntimeDocs"]
show_root_heading = false
show_root_toc_entry = false
show_source = false
heading_level = 3
members_order = "source"
inherited_members = false
show_submodules = false
show_if_no_docstring = false
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
unwrap_annotated = true
show_symbol_type_heading = true
show_symbol_type_toc = true
relative_crossrefs = true
scoped_crossrefs = true
merge_init_into_class = true
docstring_options = { warn_unknown_params = false, warn_missing_types = false, ignore_init_summary = true }
